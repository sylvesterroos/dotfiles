    key_groups:
      - age: [*main, *backup, *bachus]
  - path_regex: secrets/creek\.yaml$
    key_groups:
      - age: [*main, *backup, *creek]
  - path_regex: secrets/delta\.yaml$
    key_groups:
      - age: [*main, *backup, *delta]
  - path_regex: secrets/framework\.yaml$
    key_groups:
      - age: [*main, *backup]
