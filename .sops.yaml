#   ssh <host> 'nix run nixpkgs#ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub'
# Editing takes either Token2 FIDO2 key (age-plugin-fido2-hmac), its PIN and a
# touch; ~/.config/sops/age/keys.txt holds the plugin's identity line
# (age-plugin-fido2-hmac -m).
# After changing recipients: sops updatekeys secrets/<file>.yaml
