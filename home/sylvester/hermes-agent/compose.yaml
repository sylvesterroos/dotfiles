name: hermes-agent

# Rootless Podman: disable pod creation so userns_mode: keep-id works
# (--userns and --pod conflict in podman-compose)
x-podman:
    in_pod: false

networks:
    hermes-net:
        driver: bridge

services:
    hermes-agent:
        image: docker.io/nousresearch/hermes-agent:main
        container_name: hermes-agent
        restart: unless-stopped
        command: gateway run
        # Rootless Podman: map host UID/GID to container UID/GID 10000 so the
        # image's default runtime user (hermes, uid 10000) can write bind mounts.
        userns_mode: "keep-id:uid=10000,gid=10000"
        shm_size: "1gb"
        environment:
            HERMES_DASHBOARD: "1"
            HERMES_DASHBOARD_TUI: "1"
            # Use host nix-daemon via mounted /nix socket.
            NIX_REMOTE: daemon
        volumes:
            - /etc/nixos:/dotfiles:rw
            - /home/sylvester/Code:/Code:rw
            - /home/sylvester/PARA:/PARA:rw
            - /home/sylvester/.local/state/hermes/hermes:/opt/data:rw
            - /srv:/srv:rw
            # Share host's Nix
            - /nix:/nix:ro
            - /etc/nix:/etc/nix:ro
            - /run/current-system/sw/bin/nix:/usr/local/bin/nix:ro
        ports:
            - "8642:8642"
            - "9119:9119"
        deploy:
            resources:
                limits:
                    cpus: "2"
                    memory: 4G
        networks:
            hermes-net:
                aliases:
                    - hermes-agent

    hermes-agent-mom:
        image: docker.io/nousresearch/hermes-agent:main
        container_name: hermes-agent-mom
        restart: unless-stopped
        command: gateway run
        userns_mode: "keep-id:uid=10000,gid=10000"
        shm_size: "1gb"
        environment:
            HERMES_DASHBOARD: "1"
            HERMES_DASHBOARD_TUI: "1"
            HERMES_DASHBOARD_INSECURE: "1"
            # Use host nix-daemon via mounted /nix socket.
            NIX_REMOTE: daemon
        volumes:
            - /home/sylvester/.local/state/hermes/hermes-mom:/opt/data:rw
            # Share host's Nix
            - /nix:/nix:ro
            - /etc/nix:/etc/nix:ro
            - /run/current-system/sw/bin/nix:/usr/local/bin/nix:ro
        ports:
            - "8643:8642"
            - "9120:9119"
        deploy:
            resources:
                limits:
                    cpus: "2"
                    memory: 4G
        networks:
            hermes-net:
                aliases:
                    - hermes-agent-mom
